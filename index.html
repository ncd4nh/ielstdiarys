<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="IELSTDIARYS — sổ theo dõi lộ trình IELTS: mục tiêu, việc cần làm, luyện 4 kỹ năng, ngữ pháp, flashcard và AI chấm điểm.">
<meta name="theme-color" content="#1C1C1E">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>IELSTDIARYS</title>
<script>
/* Theme sáng/tối: áp dụng lựa chọn đã lưu trước khi vẽ trang (tránh nháy màu). Chưa chọn → theo hệ điều hành. */
(function () {
  var KEY = "ielts-theme", root = document.documentElement, mq = window.matchMedia && matchMedia("(prefers-color-scheme: dark)");
  function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function current() { return root.getAttribute("data-theme") || (mq && mq.matches ? "dark" : "light"); }
  function apply(t) {
    if (t === "light" || t === "dark") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = current() === "dark" ? "#0C1424" : "#EDF4FE";
  }
  apply(saved());
  /* pref: "light" | "dark" | "system" */
  function setPref(p) {
    try { if (p === "light" || p === "dark") localStorage.setItem(KEY, p); else localStorage.removeItem(KEY); } catch (e) {}
    apply(p); document.dispatchEvent(new CustomEvent("themechange"));
  }
  window.__theme = { pref: function () { var s = saved(); return s === "light" || s === "dark" ? s : "system"; }, set: setPref };
  window.toggleTheme = function () { setPref(current() === "dark" ? "light" : "dark"); };
  document.addEventListener("click", function (e) { if (e.target.closest && e.target.closest("[data-theme-toggle]")) window.toggleTheme(); });
  if (mq && mq.addEventListener) mq.addEventListener("change", function () { if (!saved()) apply(null); });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Poppins:wght@600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: pastel-blue workbook — left rail of skill tabs, working sheets on the right; exam views fit the viewport as two scroll panes */
:root{
  --paper:#EDF4FE; --sheet:#FFFFFF; --sheet2:#F4F8FF; --ink:#15233F; --muted:#56657F; --faint:#8D9AB2;
  --line:#D5E2F5; --line2:#E6EEFA;
  --accent:#3A6ED8; --accent-2:#6F9BEA; --accent-ink:#FFFFFF; --accent-soft:#DCE8FD; --sky:#CFE2FB; --lilac:#E3DDFB;
  --mark:#D2453A; --mark-soft:#FDE8E5;
  --hl:#FFE680; --ok:#1C8050; --ok-soft:#DDF3E7; --warn:#9A5800; --warn-soft:#FDF0D9;
  --t1:#E2EDFF; --t2:#DDF4EC; --t3:#ECE6FE; --t4:#FFECDF;
  --hero1:#D9E8FF; --hero2:#E7E1FD;
  --c-r:#00927A; --c-l:#7048C4; --c-s:#C46A12; --c-w:#C23A6E; --c-v:#2E5BD6; --c-g:#0B84A5;
  --soil:#D7B892; --soil2:#C09A6B; --trunk:#8A5A3B; --leaf:#4FAE6A; --leaf2:#86CF95; --petal:#F48FB1; --petal2:#F7B6CE; --gold:#F4C03E; --fruit:#E5533D; --egg:#FFF4DE; --chick:#FFD54F; --beak:#F08A24; --bird:#5B8DEF; --eye:#1B2440;
  --shadow:0 1px 2px rgba(42,86,170,.06),0 8px 24px rgba(42,86,170,.08);
  --shadow-h:0 2px 4px rgba(42,86,170,.08),0 14px 34px rgba(42,86,170,.14);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C1424; --sheet:#121E34; --sheet2:#172642; --ink:#E3ECFB; --muted:#A1B2CF; --faint:#7083A6;
  --line:#243759; --line2:#1B2C4B;
  --accent:#8DB3FF; --accent-2:#6B92E6; --accent-ink:#0A1532; --accent-soft:#1D3459; --sky:#14284A; --lilac:#211C43;
  --mark:#FF7D70; --mark-soft:#3A2228;
  --hl:rgba(255,212,64,.32); --ok:#5CCB92; --ok-soft:#17352A; --warn:#E8A84A; --warn-soft:#3A2D18;
  --t1:#18305A; --t2:#143630; --t3:#251F48; --t4:#3A2A1F;
  --hero1:#1A3260; --hero2:#2A2457;
  --c-r:#1FA88F; --c-l:#9473E6; --c-s:#CF7A28; --c-w:#E0608F; --c-v:#5E82F5; --c-g:#3FB3D4;
  --soil:#8C6B4B; --soil2:#74563A; --trunk:#A9774F; --leaf:#5CC07A; --leaf2:#93DBA4; --petal:#F7A3C2; --petal2:#F9C3D7; --gold:#F6CF5E; --fruit:#F06A55; --egg:#F3E6CC; --chick:#FFD95E; --beak:#F59A3C; --bird:#7FA6FF; --eye:#0C1424;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-h:0 2px 4px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1424; --sheet:#121E34; --sheet2:#172642; --ink:#E3ECFB; --muted:#A1B2CF; --faint:#7083A6;
  --line:#243759; --line2:#1B2C4B;
  --accent:#8DB3FF; --accent-2:#6B92E6; --accent-ink:#0A1532; --accent-soft:#1D3459; --sky:#14284A; --lilac:#211C43;
  --mark:#FF7D70; --mark-soft:#3A2228;
  --hl:rgba(255,212,64,.32); --ok:#5CCB92; --ok-soft:#17352A; --warn:#E8A84A; --warn-soft:#3A2D18;
  --t1:#18305A; --t2:#143630; --t3:#251F48; --t4:#3A2A1F;
  --hero1:#1A3260; --hero2:#2A2457;
  --c-r:#1FA88F; --c-l:#9473E6; --c-s:#CF7A28; --c-w:#E0608F; --c-v:#5E82F5; --c-g:#3FB3D4;
  --soil:#8C6B4B; --soil2:#74563A; --trunk:#A9774F; --leaf:#5CC07A; --leaf2:#93DBA4; --petal:#F7A3C2; --petal2:#F9C3D7; --gold:#F6CF5E; --fruit:#F06A55; --egg:#F3E6CC; --chick:#FFD95E; --beak:#F59A3C; --bird:#7FA6FF; --eye:#0C1424;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-h:0 2px 4px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.55;
  background-image:radial-gradient(900px 500px at 92% -10%,var(--sky),transparent 70%),radial-gradient(700px 420px at -5% 105%,var(--lilac),transparent 70%);background-attachment:fixed}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--sheet) 82%,transparent);backdrop-filter:blur(10px);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent-2),var(--accent));display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;box-shadow:0 4px 12px rgba(58,110,216,.35);flex:none}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.01em}
.wordmark{font-family:"Poppins","Be Vietnam Pro",system-ui,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.025em;line-height:1;color:#FFFFFF;background:#1C1C1E;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 12px 8px;white-space:nowrap;box-shadow:0 4px 14px rgba(20,26,42,.18)}
.wordmark i{font-style:normal;color:#FF3B3B}
.brand .band{font-family:var(--f-num);font-weight:700;color:var(--mark);border:1.5px solid var(--mark);border-radius:999px;padding:0 8px;font-size:12px}
.top .sp{flex:1}
.themebtn{display:inline-grid;place-items:center;width:34px;height:34px;flex:none;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;cursor:pointer;padding:0;transition:transform .15s,border-color .15s}
.themebtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.themebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.themebtn svg{width:18px;height:18px}
.themebtn .sun{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .themebtn .sun{display:block}:root:not([data-theme="light"]) .themebtn .moon{display:none}}
:root[data-theme="dark"] .themebtn .sun{display:block}
:root[data-theme="dark"] .themebtn .moon{display:none}
#authov .themebtn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px}
.status{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--faint)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.tchip{font-family:var(--f-num);font-size:12.5px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:3px 10px;cursor:pointer}
.tchip.over{background:var(--mark);color:#fff}

.shell{display:grid;grid-template-columns:212px minmax(0,1fr)}
nav.rail{padding:16px 10px;display:flex;flex-direction:column;gap:3px;position:sticky;top:56px;align-self:start;height:calc(100dvh - 56px)}
nav.rail button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--muted);transition:background .2s,color .2s,transform .2s}
nav.rail button:hover{background:color-mix(in srgb,var(--sheet) 70%,transparent);color:var(--ink);transform:translateX(2px)}
nav.rail button.on{background:var(--sheet);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
nav.rail .sw{width:10px;height:10px;border-radius:4px;flex:none;background:var(--faint);transition:transform .2s}
nav.rail button.on .sw,nav.rail button:hover .sw{transform:scale(1.25) rotate(45deg)}
nav.rail .cnt{margin-left:auto;font-family:var(--f-num);font-size:11px;color:#fff;background:var(--mark);border-radius:999px;padding:0 6px;font-weight:700}
nav.rail .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 12px 4px}
main{padding-block:20px 48px;padding-inline:clamp(16px,3vw,32px);min-width:0}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.rail{flex-direction:row;overflow-x:auto;padding:8px 12px;gap:4px;top:calc(env(safe-area-inset-top,0px) + 53px);height:auto;z-index:15;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav.rail .grp{display:none}
  nav.rail button{white-space:nowrap;padding:7px 11px}
  nav.rail button:hover{transform:none}
  .top{padding:10px 16px}
  .status .lbl{display:none}
}

.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-size:clamp(22px,2.6vw,28px);font-weight:800;letter-spacing:-.015em}
.head .sub{color:var(--muted);max-width:70ch}
.head .sp{flex:1}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:16px;font-weight:700}
.card h3{font-size:14.5px;font-weight:700}
.card .ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card .ch .sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;transition:transform .15s,box-shadow .2s,border-color .2s,background .2s,filter .2s;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--accent-ink);border-color:transparent;box-shadow:0 4px 14px rgba(58,110,216,.28)}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 6px 18px rgba(58,110,216,.36)}
.btn.red{background:var(--mark);color:#fff;border-color:var(--mark)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--ink)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=url],input[type=number],input[type=date],input[type=password],input[type=email],select,textarea{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0;color:var(--ink);font-weight:400;font-size:14px;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sheet2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip .sw{width:8px;height:8px;border-radius:2px}
.chip.sample{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.red{background:var(--mark-soft);color:var(--mark);border-color:transparent}
.chip.blue{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;padding:3px;background:var(--sheet2);flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);transition:background .2s,color .2s,box-shadow .2s}
.seg button.on{background:var(--sheet);color:var(--accent);box-shadow:var(--shadow)}
.seg button[disabled]{cursor:default}

.kpi{display:flex;flex-direction:column;gap:2px;transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.kpi.t1{background:linear-gradient(180deg,var(--t1),var(--sheet) 75%)}
.kpi.t2{background:linear-gradient(180deg,var(--t2),var(--sheet) 75%)}
.kpi.t3{background:linear-gradient(180deg,var(--t3),var(--sheet) 75%)}
.kpi.t4{background:linear-gradient(180deg,var(--t4),var(--sheet) 75%)}
.kpi .v{font-family:var(--f-num);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .d{font-size:12px;color:var(--faint)}
.hero{background:linear-gradient(120deg,var(--hero1),var(--hero2));border-color:transparent}

.bar{height:8px;background:var(--line2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:999px;transform-origin:left}
.bar.ok>i{background:var(--ok)}
.hero .bar{background:color-mix(in srgb,var(--sheet) 60%,transparent)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line2);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li.done .t{text-decoration:line-through;color:var(--faint)}
button.li{border-left:0;border-right:0;border-bottom:0;background:none;cursor:pointer;text-align:left;width:100%;border-radius:8px;transition:background .2s}
button.li:hover{background:var(--sheet2)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok);cursor:pointer;flex:none}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center;background:color-mix(in srgb,var(--sheet) 55%,transparent)}
.empty b{color:var(--ink)}

.tile{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:var(--accent-2)}
.tile .t{font-weight:700;overflow-wrap:anywhere}

.bandmark{display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:700;color:var(--mark);border:2px solid var(--mark);border-radius:50%;width:58px;height:58px;font-size:21px;transform:rotate(-6deg);flex:none;background:color-mix(in srgb,var(--sheet) 70%,transparent)}
.bandmark.sm{width:38px;height:38px;font-size:14px;border-width:1.5px}
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.crit>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sheet2)}
.crit .cb{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.crit .cb b{font-size:12.5px}
.crit .cb span{font-family:var(--f-num);font-weight:700;color:var(--mark);font-size:17px}
.err{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:9px 0;border-top:1px solid var(--line2)}
.err:first-child{border-top:0}
.err s{color:var(--mark);text-decoration-thickness:1.5px}
.err ins{color:var(--ok);text-decoration:none;font-weight:600}
.model{font-family:var(--f-read);font-size:15.5px;line-height:1.7;background:var(--sheet2);border-left:3px solid var(--ok);padding:12px 16px;border-radius:0 10px 10px 0;white-space:pre-wrap}

/* reading */
.passage{font-family:var(--f-read);font-size:17px;line-height:1.8;max-width:72ch}
.passage p{margin:0 0 1em}
.passage h2{font-family:var(--f-read);font-size:24px;margin-bottom:10px}
.plabel{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-ui);font-weight:800;font-size:13px;margin-right:8px;vertical-align:2px}
mark.hl{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px;cursor:pointer}
.vw{text-decoration:underline dotted var(--c-v) 2px;text-underline-offset:3px}
mark.er{background:var(--mark-soft);color:inherit;border-bottom:2px solid var(--mark)}
.selectable{-webkit-user-select:text;user-select:text}
.trans{font-family:var(--f-read);font-size:16px;line-height:1.75}
.trans p{margin:0 0 .7em}
.trans .spk{font-family:var(--f-ui);font-weight:700;font-size:13px;color:var(--c-l);margin-right:6px}
.pre{white-space:pre-wrap}

/* question sheet */
.qsheet{font-size:14.5px;line-height:1.6}
.qh{font-size:14px;font-weight:800;margin:14px 0 6px;color:var(--accent)}
.qh:first-child{margin-top:0}
.qtext{margin:3px 0}
.qgap{height:8px}
.qline{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--line2)}
.qline .qt{flex:1;min-width:0}
.qn{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 5px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-num);font-size:12px;font-weight:700;flex:none}
.answ{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
input.ans{width:140px;padding:4px 8px;font-family:var(--f-num);font-size:13px;border-radius:8px}
input.ans.inline{width:120px;display:inline-block}
.answ.ok input{border-color:var(--ok);background:var(--ok-soft)}
.answ.bad input{border-color:var(--mark);background:var(--mark-soft)}
.keyv{font-family:var(--f-num);font-size:12px;color:var(--ok);font-weight:700}
.prompt{font-size:15px;line-height:1.65;display:flex;flex-direction:column;gap:8px}
.prompt ul{margin:0;padding-left:20px}
.ptable{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.ptable table{font-size:13.5px}
.ptable th{background:var(--sheet2);text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink)}
.ptable td{font-variant-numeric:tabular-nums}
.chartbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--sheet2)}
.chartbox h4{font-size:13.5px;margin-bottom:6px;text-align:center}

#seltool{position:fixed;z-index:60;display:flex;gap:4px;background:var(--ink);color:var(--paper);padding:4px;border-radius:10px;box-shadow:var(--shadow-h);animation:pop .18s ease-out}
#seltool button{border:0;background:transparent;color:inherit;padding:6px 10px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px}
#seltool button:hover{background:rgba(127,127,127,.25)}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:5px 8px;border-radius:7px;max-width:240px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
#toast div{background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow-h);pointer-events:auto;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.2)}

.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--sheet);box-shadow:var(--shadow)}
.timer .disp{font-family:var(--f-num);font-weight:700;font-size:24px;letter-spacing:-.02em;min-width:90px}
.timer .disp.over{color:var(--mark);animation:pulse 1s ease-in-out infinite}
.timer .md{font-size:12px;color:var(--muted)}
.timer input[type=number]{width:76px}

/* exam work area: fits the viewport, two independent scroll panes */
.work{display:flex;flex-direction:column;gap:12px;height:calc(100dvh - 100px);min-height:520px}
.work.fs{position:fixed;inset:0;z-index:50;height:auto;min-height:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--paper);background-image:radial-gradient(900px 500px at 92% -10%,var(--sky),transparent 70%)}
.wbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wbar .ttl{font-weight:800;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(46vw,520px)}
.wbar .timer{padding:5px 10px;box-shadow:none}
.wbar .timer .disp{font-size:19px;min-width:76px}
.panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,calc(var(--split,.55) * 100% - 6px)) 12px minmax(0,1fr)}
.pane{overflow:auto;min-height:0;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);overscroll-behavior:contain;scroll-behavior:smooth}
.pane.flexcol{display:flex;flex-direction:column;gap:10px}
.pane .phead{position:sticky;top:-20px;margin:-20px -22px 12px;padding:12px 22px;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line2);z-index:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gutter{cursor:col-resize;display:flex;align-items:center;justify-content:center;touch-action:none;border-radius:6px}
.gutter::before{content:"";width:4px;height:44px;border-radius:4px;background:var(--line);transition:height .2s,background .2s}
.gutter:hover::before,.gutter:focus-visible::before,.gutter.drag::before{background:var(--accent);height:72px}
.monly{display:none}
@media (max-width:820px){
  .work{height:calc(100dvh - 150px)}
  .wbar .ttl{max-width:100%}
  .panes{display:flex}
  .gutter{display:none}
  .pane{flex:1;display:none;padding:16px}
  .pane .phead{top:-16px;margin:-16px -16px 10px;padding:10px 16px}
  .panes[data-m="L"] .pane.L,.panes[data-m="R"] .pane.R{display:block}
  .panes[data-m="L"] .pane.L.flexcol,.panes[data-m="R"] .pane.R.flexcol{display:flex}
  .monly{display:inline-flex}
}

/* flashcards */
.fc{perspective:1200px;max-width:620px;margin:0 auto;width:100%}
.fc .face{background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:28px;min-height:280px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-h);background-image:linear-gradient(160deg,var(--t1),var(--sheet) 45%)}
.fc .word{font-family:var(--f-read);font-size:clamp(30px,5vw,42px);font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.fc .ctx{font-family:var(--f-read);font-style:italic;color:var(--muted);font-size:15.5px}
.grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:620px;margin:0 auto;width:100%}
.grade button{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:10px 6px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,box-shadow .2s}
.grade button:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.grade button span{font-family:var(--f-num);font-size:11.5px;color:var(--muted);font-weight:500}
.grade button.g0{color:var(--mark)} .grade button.g3{color:var(--ok)}
.def{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:14px}
.def dt{color:var(--muted);font-weight:600;font-size:12.5px;padding-top:2px}
.def dd{margin:0;overflow-wrap:anywhere}
@media (max-width:560px){.def{grid-template-columns:minmax(0,1fr)}.def dt{padding-top:6px}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sheet2)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-family:var(--f-ui);font-size:11px}
svg.chart text.v{fill:var(--ink);font-weight:600}
svg.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
svg.chart .base{stroke:var(--faint);stroke-width:1}
.q{border-top:1px solid var(--line2);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.q:first-child{border-top:0}
.q .opts{display:flex;flex-direction:column;gap:4px}
.q .opts label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.q.right{border-left:3px solid var(--ok);padding-left:10px}
.q.wrong{border-left:3px solid var(--mark);padding-left:10px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
.note{font-size:12.5px;color:var(--muted);background:var(--sheet2);border-radius:10px;padding:8px 10px;border:1px solid var(--line2)}
.note.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
details>summary{cursor:pointer;font-weight:600}
audio{width:100%}
.wc{font-family:var(--f-num);font-size:12.5px}
.essay{font-family:var(--f-read);font-size:16px;line-height:1.75;flex:1;min-height:300px;resize:none}
.lock{opacity:.7}
.extbl td{vertical-align:middle}
.extbl td.nt{max-width:220px;color:var(--muted);font-size:12.5px}
.extbl .ttl2{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:340px}
.chip.st-new{background:var(--sheet2)}
.chip.st-due{background:var(--mark-soft);color:var(--mark);border-color:transparent}
.chip.st-redo{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.st-done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.st-mastered{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.track{border:1px solid var(--line);border-radius:14px;padding:12px;background:linear-gradient(180deg,var(--t1),var(--sheet) 80%);display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.track input[type=date]{width:auto;padding:4px 8px}
.track + .phead{margin-top:0}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{font-family:var(--f-num);font-size:11.5px;background:var(--sheet);border:1px solid var(--line);border-radius:7px;padding:1px 6px}
.gw{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--c-g) 26%,transparent) 0);cursor:help}
.pattern{font-family:var(--f-num);font-size:13px;background:var(--sheet2);border:1px dashed var(--c-g);border-radius:10px;padding:8px 10px;color:var(--ink);overflow-wrap:anywhere}
.gcard{display:flex;flex-direction:column;gap:8px;transition:transform .2s,box-shadow .2s}
.gcard:hover{box-shadow:var(--shadow-h)}
.gcard h3{font-size:16px}
.chip.flash{background:color-mix(in srgb,var(--c-g) 16%,var(--sheet));color:var(--ink);border-color:transparent;cursor:pointer}
.chip.gram{background:color-mix(in srgb,var(--c-g) 16%,var(--sheet));color:var(--ink);border-color:transparent}
/* reward garden */
.plantbox{background:linear-gradient(180deg,var(--sky),var(--sheet2) 85%);border-radius:18px;display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.plantbox svg{width:100%;height:100%;display:block}
.plant .sway{transform-origin:80px 144px;animation:sway 5s ease-in-out infinite}
.plant .bob{animation:bob 2.6s ease-in-out infinite}
.plant .wob{transform-origin:80px 134px;animation:wob 1.4s ease-in-out infinite}
.plant .tw{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}
.plant.grow .body,.enter .plant .body{transform-origin:80px 144px;animation:growIn .9s cubic-bezier(.2,.8,.3,1.25) both}
.stagestrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.stagestrip .plantbox{width:100%!important;height:auto!important;aspect-ratio:1}
.fc .face .chip{width:fit-content}
.stagestrip .st{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11.5px}
.stagestrip .st.off .plantbox{filter:grayscale(1);opacity:.4}
.stagestrip .st.cur .plantbox{box-shadow:0 0 0 2px var(--accent)}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.gtile{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:16px;padding:10px;background:var(--sheet);cursor:pointer;text-align:left;transition:transform .2s,box-shadow .2s}
.gtile:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.gtile .t{font-weight:700;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.themepick{display:flex;gap:8px;flex-wrap:wrap}
.themepick button{border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);transition:border-color .2s,transform .2s}
.themepick button:hover{transform:translateY(-2px)}
.themepick button.on{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
#celebrate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--paper) 55%,transparent);backdrop-filter:blur(6px);animation:fadeIn .3s both}
#celebrate .cele{background:var(--sheet);border:1px solid var(--line);border-radius:26px;padding:26px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow-h);display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .5s cubic-bezier(.2,.8,.3,1.3) both}
#celebrate h2{font-size:22px}
.conf{position:fixed;top:-16px;width:9px;height:14px;border-radius:2px;z-index:91;pointer-events:none;animation:fall linear forwards}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}}
@keyframes tw{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.1);opacity:1}}
@keyframes growIn{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}

/* motion */
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes stamp{0%{opacity:0;transform:scale(1.8) rotate(-18deg)}60%{opacity:1;transform:scale(.92) rotate(-4deg)}100%{transform:scale(1) rotate(-6deg)}}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes check{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.45}}
@keyframes flipIn{from{transform:rotateY(-80deg);opacity:.2}to{transform:none;opacity:1}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.enter>*{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(n+6){animation-delay:.25s}
.enter .bar>i{animation:grow .9s .2s cubic-bezier(.2,.8,.2,1) both}
.enter .bandmark,.stamp{animation:stamp .6s .15s cubic-bezier(.2,.8,.3,1.2) both}
.enter svg.chart .mk{transform-box:fill-box;transform-origin:bottom;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.enter svg.chart .ln{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s .2s ease-out both}
.enter .tile,.enter .kpi{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.pop input[type=checkbox]{animation:check .35s ease-out}
.flipin{animation:flipIn .45s cubic-bezier(.2,.8,.2,1) both;transform-origin:center}
.slidein{animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.spin{animation-duration:2s!important}}
</style>
</head>

  <button class="themebtn" type="button" data-theme-toggle title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</div>

<script>
/* IELSTDIARYS — bản chạy độc lập (Vercel).
   - Đăng nhập + đồng bộ nhiều thiết bị qua Supabase (Auth, Postgres, Storage)

  function loadScript(src) { return new Promise(function (res, rej) { var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = function () { rej(new Error("Không tải được " + src)); }; document.head.appendChild(s); }); }

  try { var m = location.hash.match(/^#ai=(.+)$/); if (m) { ls.set(PASSKEY, decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname + location.search); } } catch (e) {}
  var SETKEY = "ielts-ai-settings";
  var PROV = {
    gemini: { n: "Gemini", full: "Gemini (Google)", keyUrl: "https://aistudio.google.com/apikey", note: "Có hạn mức miễn phí khi tạo key ở Google AI Studio.", models: ["gemini-2.5-flash", "gemini-2.5-pro", "gemini-2.5-flash-lite"] },

              var f = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
              if (f.error) throw f.error; mode = "in"; draw("Đã gửi link đặt lại mật khẩu tới email của bạn.", "ok");
            }
          } catch (e) { draw(errVi(e), "err"); }
        }
      }
      draw();
    });
  }
  function resetPasswordFlow(sb) {
    var el = overlay('<h2>Đặt mật khẩu mới</h2><label class="f">Mật khẩu mới<input type="password" id="np" autocomplete="new-password"></label><button class="btn primary" id="np-go">Lưu mật khẩu</button><div class="msg"></div>');
    el.querySelector("#np-go").onclick = async function () {
      var pw = el.querySelector("#np").value; var msg = el.querySelector(".msg");
      if (pw.length < 6) { msg.className = "msg err"; msg.textContent = "Mật khẩu cần ít nhất 6 ký tự."; return; }
      var r = await sb.auth.updateUser({ password: pw });
      if (r.error) { msg.className = "msg err"; msg.textContent = errVi(r.error); return; }
      closeOverlay();
    };
  }
  function askMigrate(n) {
    return new Promise(function (resolve) {
      var el = overlay('<h2>Đưa dữ liệu lên tài khoản?</h2><p>Trình duyệt này đang có <b>' + n + '</b> mục dữ liệu học (mục tiêu, bài tập, flashcard…) chưa nằm trong tài khoản.</p><p class="small muted">Tải lên để xem được trên mọi thiết bị. Dữ liệu trên máy vẫn được giữ nguyên.</p><div class="row"><button class="btn primary" id="mg-yes">Tải lên tài khoản</button><button class="btn ghost" id="mg-no">Bỏ qua</button></div><div class="msg"></div>');
      el.querySelector("#mg-no").onclick = function () { closeOverlay(); resolve(false); };
      el.querySelector("#mg-yes").onclick = function () { el.querySelector("#mg-yes").disabled = true; el.querySelector(".msg").innerHTML = '<span class="spin"></span> Đang tải lên…'; resolve(true); };
    });
  }
  /* hồ sơ: tên hiển thị + avatar lưu trong user_metadata của Supabase Auth; ảnh nằm trong bucket media/<user_id>/ */
  function meta() { return (user && user.user_metadata) || {}; }
  function displayName() { return (meta().display_name || "").trim() || (user ? user.email.split("@")[0] : ""); }
  function avatarHtml(size) {
    var m = meta(), s = size || 32;
    var inner = m.avatar_url ? '<img src="' + escH(m.avatar_url) + '" alt="">' : escH((displayName() || "?").charAt(0));
    return '<span class="avatar" style="width:' + s + "px;height:" + s + "px;font-size:" + Math.round(s * .42) + 'px">' + inner + "</span>";
  }
  function refreshAccount() {
    window.__account = { email: user.email, name: displayName(), avatar: avatarHtml, open: function () { accountMenu(sb, user); } };
    if (typeof window.renderStatus === "function") window.renderStatus();
  }
  async function saveMeta(patch) {
    var r = await sb.auth.updateUser({ data: patch });
    if (r.error) throw r.error;
    user = r.data.user; refreshAccount();
  }
  function squareJpeg(file, size) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var m = Math.min(img.width, img.height), c = document.createElement("canvas"); c.width = c.height = size;
        c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject({ message: "Không xử lý được ảnh." }); }, "image/jpeg", .88);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject({ message: "Không đọc được ảnh. Chọn file JPG, PNG hoặc WebP." }); };
      img.src = url;
    });
  }

  function accountMenu(sb, user) {
    var old = document.getElementById("accmenu"); if (old) { old.remove(); return; }
    var el = document.createElement("div"); el.id = "accmenu";
    el.innerHTML = '<div class="eyebrow">Tài khoản</div><div class="who">' + avatarHtml(40) + '<div><b style="overflow-wrap:anywhere">' + escH(displayName()) + '</b><div class="small muted">' + escH(user.email) + '</div></div></div><p class="small muted">Dữ liệu được đồng bộ trên mọi thiết bị đăng nhập tài khoản này.</p><button class="btn" id="acc-prof">Hồ sơ &amp; tài khoản</button><button class="btn" id="acc-ai">Cài đặt AI</button><button class="btn" id="acc-out">Đăng xuất</button>';
    document.body.appendChild(el);
    el.querySelector("#acc-out").onclick = async function () { await sb.auth.signOut(); location.reload(); };
    el.querySelector("#acc-ai").onclick = function () { el.remove(); window.__aiSettings.open(); };
    el.querySelector("#acc-prof").onclick = function () { el.remove(); openProfile(); };
    setTimeout(function () { document.addEventListener("click", function h(e) { if (!el.contains(e.target)) { el.remove(); document.removeEventListener("click", h); } }); }, 0);
  }

  function openProfile() {
    var old = document.getElementById("accset"); if (old) old.remove();
    var el = document.createElement("div"); el.id = "accset"; document.body.appendChild(el);
    var TH = [["light", "Sáng"], ["dark", "Tối"], ["system", "Theo hệ thống"]];
    el.innerHTML = '<div class="ac" role="dialog" aria-label="Hồ sơ và tài khoản"><div class="row"><h2 style="flex:1">Hồ sơ &amp; tài khoản</h2><button class="btn sm ghost" id="pf-x" aria-label="Đóng">✕</button></div>' +
      '<section style="border-top:0;padding-top:0"><div class="eyebrow">Ảnh đại diện</div><div class="row" style="gap:14px"><span id="pf-av"></span><div class="stack" style="gap:6px">' +
        '<div class="row"><button class="btn sm soft" id="pf-pick" type="button">Chọn ảnh</button><button class="btn sm ghost" id="pf-rm" type="button">Xoá ảnh</button></div>' +
        '<span class="tiny muted">JPG, PNG hoặc WebP. Ảnh được cắt vuông và thu nhỏ còn 256×256.</span></div></div>' +
        '<input type="file" id="pf-file" accept="image/*" hidden><div class="msg" id="pf-avmsg"></div></section>' +
      '<section><div class="eyebrow">Tên hiển thị</div><div class="row" style="flex-wrap:nowrap"><input type="text" id="pf-name" maxlength="40" placeholder="' + escH(user.email.split("@")[0]) + '" value="' + escH(meta().display_name || "") + '"><button class="btn sm primary" id="pf-savename">Lưu</button></div><div class="msg" id="pf-namemsg"></div></section>' +
      '<section><div class="eyebrow">Giao diện</div><div class="seg" id="pf-theme" style="align-self:flex-start">' + TH.map(function (t) { return '<button type="button" data-th="' + t[0] + '">' + t[1] + "</button>"; }).join("") + "</div></section>" +
      '<section><div class="eyebrow">Đổi mật khẩu</div>' +
        '<label class="f">Mật khẩu hiện tại<input type="password" id="pf-cur" autocomplete="current-password"></label>' +
        '<label class="f">Mật khẩu mới<input type="password" id="pf-new" autocomplete="new-password" placeholder="Ít nhất 6 ký tự"></label>' +
        '<label class="f">Nhập lại mật khẩu mới<input type="password" id="pf-new2" autocomplete="new-password"></label>' +
        '<button class="btn primary" id="pf-savepw" style="align-self:flex-start">Đổi mật khẩu</button><div class="msg" id="pf-pwmsg"></div></section></div>';
    var q = function (s) { return el.querySelector(s); };
    function say(id, text, cls) { var m = q(id); m.className = "msg " + (cls || ""); m.innerHTML = text; }
    function busy(btn, on, label) { btn.disabled = on; btn.innerHTML = on ? '<span class="spin"></span>' : label; }
    function drawAvatar() { q("#pf-av").innerHTML = avatarHtml(72); q("#pf-rm").hidden = !meta().avatar_url; }
    function drawTheme() { var p = window.__theme ? window.__theme.pref() : "system"; el.querySelectorAll("[data-th]").forEach(function (b) { b.classList.toggle("on", b.dataset.th === p); }); }
    function close() { document.removeEventListener("themechange", drawTheme); el.remove(); }
    drawAvatar(); drawTheme();
    document.addEventListener("themechange", drawTheme);
    q("#pf-x").onclick = close;
    el.onclick = function (e) { if (e.target === el) close(); };

    /* avatar */
    q("#pf-pick").onclick = function () { q("#pf-file").click(); };
    q("#pf-file").onchange = async function () {
      var f = this.files[0]; this.value = ""; if (!f) return;
      if (!/^image\//.test(f.type)) return say("#pf-avmsg", "File không phải ảnh.", "err");
      if (f.size > 10 * 1024 * 1024) return say("#pf-avmsg", "Ảnh lớn hơn 10 MB.", "err");
      say("#pf-avmsg", '<span class="spin"></span> Đang tải ảnh lên…');
      try {
        var blob = await squareJpeg(f, 256), prev = meta().avatar_path;
        var path = user.id + "/avatar-" + Date.now().toString(36) + ".jpg";
        var up = await sb.storage.from("media").upload(path, blob, { contentType: "image/jpeg", upsert: false });
        if (up.error) throw up.error;
        await saveMeta({ avatar_url: window.__blobUrl(path), avatar_path: path });
        if (prev) sb.storage.from("media").remove([prev]).catch(function () {});
        drawAvatar(); say("#pf-avmsg", "Đã cập nhật ảnh đại diện.", "ok");
      } catch (e) { say("#pf-avmsg", escH(errVi(e)), "err"); }
    };
    q("#pf-rm").onclick = async function () {
      var btn = this, prev = meta().avatar_path; busy(btn, true);
      try {
        await saveMeta({ avatar_url: null, avatar_path: null });
        if (prev) sb.storage.from("media").remove([prev]).catch(function () {});
        drawAvatar(); say("#pf-avmsg", "Đã xoá ảnh đại diện.", "ok");
      } catch (e) { say("#pf-avmsg", escH(errVi(e)), "err"); }
      busy(btn, false, "Xoá ảnh");
    };

    /* tên hiển thị */
    async function saveName() {
      var btn = q("#pf-savename"), name = q("#pf-name").value.trim().replace(/\s+/g, " ");
      busy(btn, true);
      try { await saveMeta({ display_name: name || null }); drawAvatar(); say("#pf-namemsg", name ? "Đã lưu tên hiển thị." : "Đã xoá tên — dùng tên theo email.", "ok"); }
      catch (e) { say("#pf-namemsg", escH(errVi(e)), "err"); }
      busy(btn, false, "Lưu");
    }
    q("#pf-savename").onclick = saveName;
    q("#pf-name").onkeydown = function (e) { if (e.key === "Enter") saveName(); };

    /* giao diện */
    el.querySelectorAll("[data-th]").forEach(function (b) { b.onclick = function () { if (window.__theme) window.__theme.set(b.dataset.th); }; });

    /* mật khẩu: xác minh mật khẩu hiện tại trước khi đổi */
    async function savePw() {
      var btn = q("#pf-savepw"), cur = q("#pf-cur").value, pw = q("#pf-new").value, pw2 = q("#pf-new2").value;
      if (!cur) return say("#pf-pwmsg", "Nhập mật khẩu hiện tại.", "err");
      if (pw.length < 6) return say("#pf-pwmsg", "Mật khẩu mới cần ít nhất 6 ký tự.", "err");
      if (pw !== pw2) return say("#pf-pwmsg", "Hai lần nhập mật khẩu mới không khớp.", "err");
      if (pw === cur) return say("#pf-pwmsg", "Mật khẩu mới phải khác mật khẩu hiện tại.", "err");
      busy(btn, true);
      try {
        var chk = await sb.auth.signInWithPassword({ email: user.email, password: cur });
        if (chk.error) throw /invalid login credentials/i.test(chk.error.message) ? { message: "Mật khẩu hiện tại không đúng." } : chk.error;
        var r = await sb.auth.updateUser({ password: pw });
        if (r.error) throw r.error;
        q("#pf-cur").value = q("#pf-new").value = q("#pf-new2").value = "";
        say("#pf-pwmsg", "Đã đổi mật khẩu.", "ok");
      } catch (e) { say("#pf-pwmsg", escH(errVi(e)), "err"); }
      busy(btn, false, "Đổi mật khẩu");
    }
    q("#pf-savepw").onclick = savePw;
    q("#pf-new2").onkeydown = function (e) { if (e.key === "Enter") savePw(); };
  }

  /* ================= cloud: Supabase ================= */
  var sb = null, user = null, base = "";
  var caches = {}, loaded = {}, listeners = {}, channel = null;
  function mkSnap(kind) {
    var docs = Array.from((caches[kind] || new Map()).values()).map(function (o) { return { id: o.id, exists: true, data: function () { return o.data; }, metadata: { fromCache: false, hasPendingWrites: false } }; });
    return { docs: docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false }, docChanges: function () { return []; } };
  }
  function emit(kind) { if (!loaded[kind]) return; (listeners[kind] || new Set()).forEach(function (cb) { try { cb(mkSnap(kind)); } catch (e) { console.error(e); } }); }
  async function fetchKind(kind) {
    var out = new Map();
    for (var from = 0; ; from += 1000) {
      var r = await sb.from("items").select("id,data").eq("kind", kind).order("id").range(from, from + 999);
      if (r.error) throw r.error;
      r.data.forEach(function (row) { out.set(row.id, { id: row.id, data: row.data || {} }); });
      if (r.data.length < 1000) break;
    }
    caches[kind] = out; loaded[kind] = true; emit(kind);
  }
  function startRealtime() {
    if (channel) return;
    channel = sb.channel("items-" + user.id).on("postgres_changes", { event: "*", schema: "public", table: "items", filter: "user_id=eq." + user.id }, function (p) {
      if (p.eventType === "DELETE") { var id = p.old && p.old.id; for (var k in caches) if (caches[k].delete(id)) emit(k); }
      else { var row = p.new; if (!row || !caches[row.kind]) return; caches[row.kind].set(row.id, { id: row.id, data: row.data || {} }); emit(row.kind); }
    }).subscribe();
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && user) Object.keys(listeners).forEach(function (k) { fetchKind(k).catch(function () {}); }); });
  function dbErr(e) { return { code: /quota|limit/i.test((e && e.message) || "") ? "quota_exceeded" : "unavailable", message: (e && e.message) || "error" }; }
  var db = {
    doc: function () {
      return {
        collection: function (kind) {
          return {
            doc: function (id) {
              return {
                set: async function (body) {
                  if (caches[kind]) { caches[kind].set(id, { id: id, data: body }); emit(kind); }
                  var r = await sb.from("items").upsert({ user_id: user.id, id: id, kind: kind, data: body, updated_at: new Date().toISOString() }, { onConflict: "user_id,id" });
                  if (r.error) throw dbErr(r.error);
                },
                update: async function (p) { var cur = caches[kind] && caches[kind].get(id); return this.set(Object.assign({}, cur ? cur.data : {}, p)); },
                delete: async function () {
                  if (caches[kind]) { caches[kind].delete(id); emit(kind); }
                  var r = await sb.from("items").delete().eq("user_id", user.id).eq("id", id);
                  if (r.error) throw dbErr(r.error);
                }
              };
            },
            onSnapshot: function (cb, onErr) {
              (listeners[kind] = listeners[kind] || new Set()).add(cb);
              if (!caches[kind]) { caches[kind] = new Map(); fetchKind(kind).catch(function (e) { if (onErr) onErr({ code: "unavailable", message: e.message }); }); }
              else if (loaded[kind]) setTimeout(function () { cb(mkSnap(kind)); }, 0);
              startRealtime();
              return function () { listeners[kind].delete(cb); };
            }
          };
        }
      };
    }
  };
  var userNs = {
    id: async function () { return user ? user.id : null; },
    me: async function () { return { id: user && user.id, name: user && displayName() }; },
    isOwner: function () { return true; }, canEdit: function () { return true; }, can: function () { return true; }
  };
  var assets = {
    acceptsAny: true,
    upload: async function (blob, opts) {
      var type = (opts && opts.type) || blob.type || "application/octet-stream";
      var ext = (blob.name && blob.name.indexOf(".") > 0 ? blob.name.split(".").pop() : (type.split("/")[1] || "bin")).replace(/[^a-z0-9]/gi, "").slice(0, 6) || "bin";
      var path = user.id + "/" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + "." + ext;
      var r = await sb.storage.from("media").upload(path, blob, { contentType: type, upsert: false });
      if (r.error) throw { code: /size|large|exceed/i.test(r.error.message) ? "too_large" : "upstream_error", message: r.error.message };
      return { id: path, url: window.__blobUrl(path), sizeBytes: blob.size, contentType: type };
    },
    delete: async function (id) { await sb.storage.from("media").remove([id]); return { deleted: true }; },
    list: async function () { return { assets: [], usage: {} }; }
  };

  async function migrate(uid) {
    var flag = "ielts-migrated-" + uid; if (ls.get(flag)) return;
    var local = {}; try { local = JSON.parse(ls.get(LKEY) || "{}"); } catch (e) {}
    var rows = [];
    Object.keys(local).forEach(function (kind) { (Array.isArray(local[kind]) ? local[kind] : []).forEach(function (o) { if (!o || !o.id) return; var d = Object.assign({}, o); delete d.id; rows.push({ user_id: uid, id: o.id, kind: kind, data: d, updated_at: new Date().toISOString() }); }); });
    if (!rows.length) { ls.set(flag, "1"); return; }
    var c = await sb.from("items").select("id", { count: "exact", head: true });
    if (c.error || (c.count || 0) > 0) { ls.set(flag, "1"); return; }
    var yes = await askMigrate(rows.length);
    if (yes) {
      for (var i = 0; i < rows.length; i += 400) { var r = await sb.from("items").upsert(rows.slice(i, i + 400), { onConflict: "user_id,id" }); if (r.error) { overlay('<h2>Chưa tải lên được</h2><p class="small">' + escH(r.error.message) + '</p><button class="btn primary" onclick="location.reload()">Thử lại</button>'); return new Promise(function () {}); } }
      closeOverlay();
    }
    ls.set(flag, "1");
  }

  var cloud = (async function () {
    var cfg = null;
    try { cfg = await fetch("/api/config").then(function (r) { return r.ok ? r.json() : null; }); } catch (e) {}
    if (!cfg || !cfg.supabaseUrl || !cfg.supabaseKey) return false;
    base = cfg.supabaseUrl.replace(/\/$/, "");
    window.__blobUrl = function (id) { return base + "/storage/v1/object/public/media/" + id.split("/").map(encodeURIComponent).join("/"); };
    try { await loadScript(SUPA_CDN); } catch (e) { console.error(e); return false; }
    sb = window.supabase.createClient(base, cfg.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    var recovering = false;
    sb.auth.onAuthStateChange(function (ev) { if (ev === "PASSWORD_RECOVERY") { recovering = true; setTimeout(function () { resetPasswordFlow(sb); }, 50); } });
    var session = (await sb.auth.getSession()).data.session;
    if (!session) {
      if (ls.get(OFF) === "1") { window.__account = { email: null, open: function () { ls.del(OFF); location.reload(); } }; return false; }
      session = await loginFlow(sb);
      if (!session) { window.__account = { email: null, open: function () { ls.del(OFF); location.reload(); } }; return false; }
    }
    user = session.user; ls.del(OFF);
    await migrate(user.id);
    try { await pullSettings(); } catch (e) {}
    refreshAccount();
    sb.auth.onAuthStateChange(function (ev, s) { if (ev === "USER_UPDATED" && s && s.user) { user = s.user; refreshAccount(); } });
    return true;
  })().catch(function (e) { console.error(e); return false; });

  window.claude = {
    use: function (name) {
      if (name === "sample") return cloud.then(function () { return useSample(); });
      if (name === "downloads") return Promise.resolve(downloads);
      if (name === "db") return cloud.then(function (ok) { return ok ? db : null; });
      if (name === "user") return cloud.then(function (ok) { return ok ? userNs : null; });
      if (name === "assets") return cloud.then(function (ok) { return ok ? assets : null; });
      return Promise.resolve(null);
    }
  };
})();

</script>
<script>
(() => {
"use strict";
/* ---------- utilities ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = (s, n) => { const d = parseYmd(s); d.setDate(1); d.setMonth(d.getMonth() + n); return ymd(d); };
const weekStart = s => { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const monthStart = s => s.slice(0, 8) + "01";
const periodKey = (p, s) => p === "day" ? s : p === "week" ? weekStart(s) : monthStart(s);
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const WD = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
const WDL = ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
const dmy = s => { const d = parseYmd(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const dm = s => { const d = parseYmd(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };

/* ---------- text reflow (fixes hard line breaks from copied PDFs / web pages) ---------- */
const SPEAKER = /^[A-Z][A-Za-z .'’-]{0,24}:\s/;
const LISTY = /^(\d{1,2}[\.\)]|[•\-–▪●])\s/;
const LABEL = /^[A-H]$/;

  for (const b of t.split(/\n\s*\n/)) {
    const lines = b.split("\n").map(s => s.replace(/\s+/g, " ").trim()).filter(Boolean); if (!lines.length) continue;
    const longs = lines.map(l => l.length).filter(n => n > 25).sort((a, b) => a - b);
    const med = longs.length ? longs[Math.floor(longs.length / 2)] : 70;
    const ends = l => /[.!?;:"”’)\]]$/.test(l);
    const wrapped = lines.length > 2 && lines.filter(l => !ends(l)).length / lines.length > 0.25;
    let cur = "";
    lines.forEach((l, i) => {
      if (!cur) { cur = l; return; }
      const prev = lines[i - 1];
      const heading = prev.length < med * 0.6 && !ends(prev) && /^[A-Z"“‘]/.test(l);
      const brk = LABEL.test(prev) || LABEL.test(l) || LISTY.test(l) || SPEAKER.test(l) || /^Questions?\s+\d/i.test(l) || heading || (ends(prev) && (!wrapped || prev.length < med * 0.82));

const KMAP = { passages: "reading", listening: "listening", writing: "writing", speaking: "speaking" };
function titleOf(kind, it) {
  if (!it) return "";
  if (kind === "writing") return `${it.task === "task1" ? "Task 1" : "Task 2"} · ${(it.prompt || "Không có đề").replace(/\s+/g, " ").slice(0, 70)}`;
  if (kind === "speaking") return `Part ${it.part} · ${(it.question || "").replace(/\s+/g, " ").slice(0, 70)}`;
  return it.title || "";
}
function studyInfo(kind, it) {
  const ses = S.data.sessions.filter(x => x.refId === it.id);
  const dates = new Set(ses.map(x => x.date));
  (it.attempts || []).forEach(a => a.date && dates.add(a.date));
  if (it.lastStudied) dates.add(it.lastStudied);
  if ((kind === "writing" && it.essay) || (kind === "speaking" && it.transcript)) dates.add(ymd(new Date(it.createdAt)));
  const list = [...dates].sort();
  const sec = ses.reduce((a, x) => a + (x.usedSec || 0), 0) + (kind === "writing" ? (it.timeSec || 0) : kind === "speaking" ? (it.durationSec || 0) : 0);
  return { first: list[0] || null, last: list[list.length - 1] || null, times: list.length, min: Math.round(sec / 60) };
}
function resultOf(kind, it) {
  if (kind === "writing" || kind === "speaking") return it.feedback && it.feedback.overall != null ? { text: `Band ${band(it.feedback.overall)}`, sc: bandScore(it.feedback.overall) } : null;
  const r = it.sheetResult && it.sheetResult.marks ? it.sheetResult : it.quizResult;
  if (!r || !r.total) { const a = [...(it.attempts || [])].reverse().find(x => x.correct != null && x.total); if (!a) return null; return { text: `${a.correct}/${a.total} câu`, sc: a.correct / a.total }; }
  return { text: `${r.correct}/${r.total} câu${r.total >= 10 ? ` · Band ${band(bandFrom(r.correct, r.total, KMAP[kind]))}` : ""}`, sc: r.correct / r.total };
}
function bandScore(b) { const tgt = parseFloat(mainGoal()?.targetValue) || 6.5; const d = Number(b) - tgt; return d >= 0 ? .9 : d >= -.5 ? .75 : d >= -1 ? .6 : .4; }
const RV = { new: "Chưa học", due: "Đến hạn ôn", redo: "Cần học lại", done: "Đã hoàn thành", mastered: "Đã nắm vững" };
function rvState(kind, it) {
  if (it.rvStatus === "mastered") return "mastered";
  if (it.rvNext && it.rvNext <= today()) return "due";
  if (it.rvStatus === "redo") return "redo";
  if (it.rvStatus === "done") return "done";
  return studyInfo(kind, it).times ? "done" : "new";
}
const rvChip = st => `<span class="chip st-${st}">${RV[st]}</span>`;
function nextLabel(d) { if (!d) return ""; const n = daysBetween(today(), d); return n === 0 ? "hôm nay" : n > 0 ? `còn ${n} ngày` : `quá ${-n} ngày`; }
const ivFor = (sc, step) => { if (sc < .5) return 1; const base = sc < .7 ? 3 : sc < .85 ? 7 : 14; return Math.min(60, Math.round(base * (1 + .5 * (step - 1)))); };
async function syncReviewTask(kind, id, next, completed) {
  const it = find(kind, id); const sk = KMAP[kind];
  for (const t of S.data.tasks.filter(t => t.refId === id && t.auto && !t.done)) {
    if (completed && t.date <= today()) await patch("tasks", t.id, { done: true, doneDate: today() }); else await del("tasks", t.id);
  }
  if (next && it) await put("tasks", { period: "day", date: next, title: `Ôn lại: ${titleOf(kind, it)}`.slice(0, 140), skill: sk, minutes: { reading: 20, listening: 30, writing: 40, speaking: 15 }[sk], done: false, auto: true, refKind: kind, refId: id });
}
async function scheduleItem(kind, id, sc, attempt = {}, days) {
  const it = find(kind, id); if (!it) return;
  const step = (it.rvStep || 0) + 1; const iv = days ?? ivFor(sc, step); const next = addDays(today(), iv);
  const attempts = [...(it.attempts || []), { date: today(), ...attempt }].slice(-20);
  await patch(kind, id, { rvStep: step, rvStatus: sc < .7 ? "redo" : "done", rvNext: next, lastStudied: today(), attempts });
  await syncReviewTask(kind, id, next, true);
  toast(`Đã xếp lịch ôn lại: ${WDL[parseYmd(next).getDay()]}, ${dm(next)} (sau ${iv} ngày).`);
}
function trackPanel(kind, it) {

      <div class="stack" style="margin-top:6px"><textarea id="${nk}" data-draft="${nk}" rows="3" placeholder="VD: Sai dạng Matching headings, cần đọc kỹ đoạn C…">${dv(nk, it.studyNote || "")}</textarea><div class="row end"><button class="btn sm primary" data-act="savestudynote" data-kind="${kind}" data-id="${it.id}">Lưu ghi chú</button></div></div></details>
  </div>`;
}
function exerciseList(kind, items, emptyHTML) {

    const m = l.match(/^(\d{1,2})[\.\)]?\s+(.*)$/);

const RB = [[39, 9], [37, 8.5], [35, 8], [33, 7.5], [30, 7], [27, 6.5], [23, 6], [19, 5.5], [15, 5], [13, 4.5], [10, 4], [8, 3.5], [6, 3], [4, 2.5]];

  ps.forEach(t => { if (LABEL.test(t)) { label = t; return; } out += `<p>${label ? `<span class="plabel">${label}</span>` : ""}${decorate(t, p.highlights, vws.filter(v => !isG(v)).map(v => v.word), vws.filter(isG).map(v => v.word))}</p>`; label = ""; });
  return out;
}

function readingDetail(p) {

function vocabMini(vws) {

  return `<div class="list">${sortBy(vws, v => v.createdAt).map(v => isG(v) ? `<div class="li" style="align-items:flex-start"><div class="grow"><div class="t"><span class="chip gram">Ngữ pháp</span> ${esc(v.structure || v.word)}</div><div class="small">${v.aiStatus === "pending" ? `<span class="muted"><span class="spin"></span> đang giải thích…</span>` : v.pattern ? `<span class="muted num">${esc(v.pattern)}</span>` : v.aiStatus === "error" ? `<button class="btn sm" data-act="enrich" data-id="${v.id}">Giải thích lại bằng AI</button>` : `<i>${esc(v.word)}</i>`}</div></div><button class="btn ghost sm" data-act="gopen" data-id="${v.id}">Xem</button></div>` : `<div class="li" style="align-items:flex-start"><div class="grow"><div class="t">${esc(v.word)} <span class="muted small">${esc(v.ipa || "")}</span></div><div class="small">${v.aiStatus === "pending" ? `<span class="muted"><span class="spin"></span> đang tra…</span>` : v.meaning_vi ? `<span class="muted">${esc(v.pos || "")}</span> ${esc(v.meaning_vi)}` : v.aiStatus === "error" ? `<button class="btn sm" data-act="enrich" data-id="${v.id}">Tra lại bằng AI</button>` : ""}</div></div></div>`).join("")}</div>`;
}

/* ----- Listening ----- */
function transcriptHTML(t, vws) {
  return reflow(t).map(par => { const m = par.match(SPEAKER); const body = m ? par.slice(m[0].length) : par; return `<p>${m ? `<span class="spk">${esc(m[0].trim())}</span>` : ""}${decorate(body, [], vws.filter(v => !isG(v)).map(v => v.word), vws.filter(isG).map(v => v.word))}</p>`; }).join("");
}

/* ----- Feedback ----- */
const CRIT = {
  writing: [["TR", "Task Response / Achievement"], ["CC", "Coherence & Cohesion"], ["LR", "Lexical Resource"], ["GRA", "Grammatical Range & Accuracy"]],
  speaking: [["FC", "Fluency & Coherence"], ["LR", "Lexical Resource"], ["GRA", "Grammatical Range & Accuracy"], ["P", "Pronunciation"]]
};
function feedbackHTML(kind, fb) {
  if (!fb) return "";
  const li = a => (a || []).map(x => `<li>${esc(x)}</li>`).join("");
  return `<div class="stack" style="gap:14px">
    <div class="row" style="gap:14px"><span class="bandmark stamp">${band(fb.overall)}</span><div><div class="eyebrow">Band ước tính</div><div class="small muted">AI chấm theo band descriptors công khai của IELTS. Dùng để tham khảo, không thay giám khảo thật.</div></div></div>
    <div class="crit">${CRIT[kind].map(([k, n]) => { const c = (fb.criteria || {})[k] || {}; return `<div><div class="cb"><b>${n}</b><span>${c.band == null ? "–" : band(c.band)}</span></div><div class="small muted">${esc(c.comment_vi || "")}</div></div>`; }).join("")}</div>
    ${fb.strengths_vi?.length || fb.improvements_vi?.length ? `<div class="grid g2"><div><h3>Điểm mạnh</h3><ul class="small">${li(fb.strengths_vi)}</ul></div><div><h3>Cần cải thiện</h3><ul class="small">${li(fb.improvements_vi)}</ul></div></div>` : ""}
    ${fb.errors?.length ? `<div><h3>Lỗi sai (${fb.errors.length})</h3><div>${fb.errors.map(e => `<div class="err"><div><s>${esc(e.original)}</s> → <ins>${esc(e.correction)}</ins> <span class="chip">${esc(e.type || "")}</span></div><div class="small muted">${esc(e.explain_vi || "")}</div></div>`).join("")}</div></div>` : ""}
    ${fb.better_phrases?.length ? `<div><h3>Nâng cấp từ vựng</h3><div>${fb.better_phrases.map(e => `<div class="err"><div>${esc(e.from)} → <ins>${esc(e.to)}</ins></div><div class="small muted">${esc(e.why_vi || "")}</div></div>`).join("")}</div></div>` : ""}
    ${fb.model_answer ? `<div><h3>Bài mẫu gợi ý (band 8+)</h3><div class="model selectable" data-kind="${kind}" data-id="">${esc(fb.model_answer)}</div><p class="tiny muted">Bôi đen cụm từ hay trong bài mẫu để lưu vào flashcard.</p></div>` : ""}
    ${fb.next_steps_vi?.length ? `<div><h3>Bước tiếp theo</h3><ul class="small">${li(fb.next_steps_vi)}</ul></div>` : ""}
  </div>`;
}
function markErrors(text, fb) {
  let h = esc(text); if (!fb || !fb.errors) return h;
  fb.errors.forEach(e => { if (!e.original || e.original.length < 2) return; const r = new RegExp(escRe(esc(e.original)) + "(?![^<]*>)"); h = h.replace(r, m => `<mark class="er" data-tip="→ ${esc(e.correction)}">${m}</mark>`); });
  return h;
}

function vocabFilter(f, type = S.ui.vocType) {
  const t = today(), ws = weekStart(t), ms = monthStart(t), V = S.data.vocab.filter(c => c.inFlash !== false && (type === "all" || (type === "grammar") === isG(c)));
  if (f === "due") return V.filter(c => (c.due || t) <= t);
  if (f === "day") return V.filter(c => c.addedDate === t);
  if (f === "week") return V.filter(c => (c.addedDate || "") >= ws);
  if (f === "month") return V.filter(c => (c.addedDate || "") >= ms);
  return V;
}

    ${c.examples?.length ? `<dt>Ví dụ</dt><dd class="stack" style="gap:6px">${c.examples.map(e => `<div><span style="font-family:var(--f-read)">${esc(e.en)}</span><br><span class="small muted">${esc(e.vi)}</span></div>`).join("")}</dd>` : ""}
    ${c.mistakes?.length ? `<dt>Lỗi hay gặp</dt><dd><ul style="margin:0;padding-left:18px">${c.mistakes.map(u => `<li>${esc(u)}</li>`).join("")}</ul></dd>` : ""}

  </dl>${c.aiStatus === "pending" ? `<p class="small muted"><span class="spin"></span> AI đang giải thích…</p>` : !c.meaning_vi ? `<div class="row">${busyBtn("enrich-" + c.id, "Giải thích bằng AI", "enrich", `data-id="${c.id}"`, "")}</div>` : ""}`;
}

  render();

    S.db = db; S.uid = uid; S.root = db.doc(`data/users/${uid}/root`); S.mode = "cloud";

      S.data[k] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
